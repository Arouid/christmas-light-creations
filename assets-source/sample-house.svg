<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <!-- Sample house for the public designer (/design/): a two-story home with a
       garage wing at dusk, no lights. Rooflines match src/design/sampleDesign.js.
       Rendered to public/images/design/sample-house.jpg by scripts/sample-house.mjs. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="0.55" stop-color="#3b4f86"/>
      <stop offset="0.85" stop-color="#c98a72"/>
      <stop offset="1" stop-color="#e7b27f"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6a3a"/>
      <stop offset="1" stop-color="#2a4a28"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d57"/>
      <stop offset="1" stop-color="#383a42"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7a089"/>
      <stop offset="1" stop-color="#9c8670"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e5c"/>
      <stop offset="1" stop-color="#1b2840"/>
    </linearGradient>
  </defs>

  <!-- sky, moon, a few stars -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <circle cx="1120" cy="110" r="34" fill="#f4ecd2" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="160" cy="80" r="1.6"/><circle cx="300" cy="130" r="1.2"/><circle cx="520" cy="60" r="1.4"/>
    <circle cx="760" cy="95" r="1.2"/><circle cx="930" cy="50" r="1.6"/><circle cx="1010" cy="170" r="1.1"/>
  </g>

  <!-- distant trees behind the house -->
  <path d="M0 520 Q60 430 130 470 Q190 400 260 460 L260 640 L0 640 Z" fill="#26364f"/>
  <path d="M1180 520 Q1230 450 1280 480 L1280 640 L1180 640 Z" fill="#26364f"/>

  <!-- lawn, driveway, walkway -->
  <rect y="610" width="1280" height="190" fill="url(#lawn)"/>
  <path d="M935 620 L1145 620 L1260 800 L860 800 Z" fill="#8d8f93"/>
  <path d="M575 620 L625 620 L660 800 L540 800 Z" fill="#9a9b9e"/>

  <!-- main two-story block -->
  <rect x="300" y="296" width="600" height="324" fill="url(#brick)"/>
  <g stroke="#8a7561" stroke-width="1" opacity="0.35">
    <line x1="300" y1="360" x2="900" y2="360"/><line x1="300" y1="440" x2="900" y2="440"/><line x1="300" y1="520" x2="900" y2="520"/>
  </g>
  <polygon points="270,300 380,170 820,170 930,300" fill="url(#roof)"/>
  <line x1="262" y1="302" x2="938" y2="302" stroke="#2c2e35" stroke-width="8"/>

  <!-- upper windows -->
  <g fill="url(#glass)" stroke="#f1ece4" stroke-width="7">
    <rect x="350" y="336" width="80" height="92"/><rect x="460" y="336" width="80" height="92"/>
    <rect x="660" y="336" width="80" height="92"/><rect x="770" y="336" width="80" height="92"/>
  </g>
  <g stroke="#f1ece4" stroke-width="3">
    <line x1="390" y1="336" x2="390" y2="428"/><line x1="500" y1="336" x2="500" y2="428"/>
    <line x1="700" y1="336" x2="700" y2="428"/><line x1="810" y1="336" x2="810" y2="428"/>
  </g>

  <!-- porch with a small front gable over the door -->
  <rect x="530" y="430" width="140" height="190" fill="#c9b8a4"/>
  <polygon points="520,432 600,368 680,432" fill="url(#roof)"/>
  <line x1="514" y1="434" x2="686" y2="434" stroke="#2c2e35" stroke-width="7"/>
  <path d="M572 620 L572 510 Q600 478 628 510 L628 620 Z" fill="#5b2b22"/>
  <circle cx="618" cy="560" r="3" fill="#e2c26a"/>
  <rect x="540" y="450" width="10" height="170" fill="#efe8dd"/><rect x="650" y="450" width="10" height="170" fill="#efe8dd"/>

  <!-- lower windows -->
  <g fill="url(#glass)" stroke="#f1ece4" stroke-width="7">
    <rect x="350" y="470" width="110" height="100"/><rect x="740" y="470" width="110" height="100"/>
  </g>
  <g stroke="#f1ece4" stroke-width="3">
    <line x1="405" y1="470" x2="405" y2="570"/><line x1="795" y1="470" x2="795" y2="570"/>
  </g>

  <!-- garage wing -->
  <rect x="900" y="430" width="280" height="190" fill="url(#brick)"/>
  <polygon points="885,432 1040,350 1195,432" fill="url(#roof)"/>
  <line x1="880" y1="434" x2="1200" y2="434" stroke="#2c2e35" stroke-width="7"/>
  <rect x="940" y="490" width="200" height="130" fill="#e9e3d8"/>
  <g stroke="#cfc6b8" stroke-width="3">
    <line x1="940" y1="522" x2="1140" y2="522"/><line x1="940" y1="554" x2="1140" y2="554"/><line x1="940" y1="586" x2="1140" y2="586"/>
  </g>
  <circle cx="1040" cy="395" r="16" fill="url(#glass)" stroke="#f1ece4" stroke-width="5"/>

  <!-- front shrubs -->
  <g fill="#2f5a2e">
    <ellipse cx="335" cy="612" rx="45" ry="26"/><ellipse cx="420" cy="616" rx="40" ry="22"/><ellipse cx="500" cy="614" rx="34" ry="22"/>
    <ellipse cx="705" cy="614" rx="34" ry="22"/><ellipse cx="785" cy="616" rx="40" ry="22"/><ellipse cx="865" cy="612" rx="40" ry="26"/>
  </g>

  <!-- oak tree on the left -->
  <rect x="140" y="470" width="26" height="160" fill="#4a3324"/>
  <g fill="#335a30">
    <circle cx="150" cy="430" r="95"/><circle cx="85" cy="470" r="60"/><circle cx="215" cy="470" r="62"/><circle cx="150" cy="370" r="66"/>
  </g>
  <g fill="#3d6b38" opacity="0.8">
    <circle cx="120" cy="410" r="40"/><circle cx="190" cy="440" r="36"/>
  </g>
</svg>
