<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b1a" />
    <!-- Safe subset of a Content Security Policy (security review risk 10): no plugins, no
         <base> tricks, forms only post here, http upgraded. GitHub Pages can't send headers. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <!-- Behind the owner's switch (the spec is named in this page's main.jsx): kept out of search
         (noindex, not in the sitemap, no canonical or share card) and nothing in this file says what
         the page is about. It asks the server and draws itself only while the switch is on; off, it
         goes home. -->
    <meta name="robots" content="noindex, noai, noimageai" />
    <title>Christmas Light Creations</title>
    <!-- Self-hosted fonts (public/fonts/, SIL OFL); the two used above the fold load first. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <!-- White under the page too (the site's own body rule is night blue). -->
  <body style="background-color: #fff">
    <div id="root"></div>
    <script type="module" src="/src/gift/main.jsx"></script>
  </body>
</html>
