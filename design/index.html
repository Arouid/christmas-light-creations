<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b1a" />
    <meta name="description" content="Design your Christmas lights for free: try lights on our sample house or a photo of your own home, then get a free estimate from Christmas Light Creations in Pearland, TX." />

    <!-- Safe subset of a Content Security Policy (security review risk 10): no plugins, no
         <base> tricks, forms only post here, http upgraded. GitHub Pages can't send headers. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <title>Design your Christmas lights | Christmas Light Creations</title>
    <!-- Self-hosted fonts (public/fonts/, SIL OFL); the two used above the fold load first. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The sample design, already drawn (scripts/sample-design.mjs): the big picture at the top. -->
    <link rel="preload" href="/images/design/sample-design.webp" as="image" type="image/webp" fetchpriority="high" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/design/main.jsx"></script>
  </body>
