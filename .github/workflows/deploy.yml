name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # While the live site still has the old pages: which pages did this push change? Writes their
      # list to changed-pages.json for the IndexNow ping and the real dates into dist/sitemap.xml
      # (scripts/indexnow.mjs, docs/specs/indexnow.md). Best effort: without the list, the ping sends every URL.
      - name: Changed pages
        continue-on-error: true
        run: node scripts/indexnow.mjs --compare
      # Since v4 dotfiles are left out unless asked for; dist/.well-known/tdmrep.json (the AI opt-out) must ship.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      # The sitemap and the list, for the IndexNow ping after the deploy (the Pages artifact can't be read there).
      - uses: actions/upload-artifact@v7
        with:
          name: sitemap
          path: |
            dist/sitemap.xml
            changed-pages.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Once the site is live, tell Bing and the other IndexNow engines which pages changed
      # (scripts/indexnow.mjs, docs/specs/indexnow.md); none, no ping. Best effort: none of this can fail the deploy.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false
      # Back where the build job had them: dist/sitemap.xml and changed-pages.json.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sitemap
          path: .
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
