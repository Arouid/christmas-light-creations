name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The sitemap alone, for the IndexNow ping after the deploy (the Pages artifact can't be read there).
      - uses: actions/upload-artifact@v7
        with:
          name: sitemap
          path: dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Once the site is live, tell Bing and the other IndexNow engines which pages to recrawl
      # (scripts/indexnow.mjs, docs/specs/indexnow.md). Best effort: none of this can fail the deploy.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sitemap
          path: dist
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
